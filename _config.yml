title: Badgelife Archive
description: A community-maintained historical archive of conference badges and SAOs (Shitty Add-Ons) — what they are, who made them, how to get one, and how to make your own.
theme: just-the-docs

plugins:
  - jekyll-redirect-from

# GitHub Pages project site. The deploy workflow passes --baseurl automatically;
# these values keep local builds identical to production.
url: https://holdTheDoorHoid.github.io
baseurl: /badgelife-archive
favicon_ico: assets/images/favicon.ico

collections:
  posts:
    output: true
    permalink: /:collection/:name/
  badges:
    # One file per badge/SAO under _badges/<event>/<slug>.md -> /badges/<event>/<slug>/
    output: true
    permalink: /badges/:path/

defaults:
  - scope:
      path: ""
      type: badges
    values:
      layout: badge
      nav_exclude: true

just_the_docs:
  collections:
    badges:
      name: Archive entries
      nav_exclude: true
      search_exclude: false

exclude:
  - vendor
  - .bundle
  - scripts
  - data
  - docs/schema
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - "*.py"

# Site search (Just the Docs built-in, full text). The faceted archive search lives at /badges/.
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false
  focus_shortcut_key: 'k'

mermaid:
  version: "9.1.3"

aux_links:
  "Archive on GitHub":
    - "//github.com/holdTheDoorHoid/badgelife-archive"
  "badge.life (the original)":
    - "https://badge.life/"
aux_links_new_tab: true

nav_enabled: true
heading_anchors: true

last_edit_timestamp: true
last_edit_time_format: "%b %e %Y at %I:%M %p"

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub."
gh_edit_repository: "https://github.com/holdTheDoorHoid/badgelife-archive"
gh_edit_branch: "main"
gh_edit_view_mode: "tree"

color_scheme: dark
